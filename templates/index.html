
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERA | Voice AI Assistant</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <main class="assistant">
        <header>
            <div class="logo">V</div>
            <h1>VERA</h1>
            <p>Voice-Enabled Responsive Assistant</p>
        </header>

        <section class="status-panel">
            <div class="status-dot" id="status-dot"></div>
            <span id="status" role="status" aria-live="polite">
                Ready when you are
            </span>
        </section>

        <section class="conversation">
            <p>Speak clearly into your microphone.</p>
            <p id="recording-time">Recording time: 0 seconds</p>

            <div class="controls">
                <button id="mic-button" type="button">
                    Start recording
                </button>

                <button id="stop-button" type="button" disabled>
                    Stop recording
                </button>

                <button id="upload-button" type="button" disabled>
                    Upload audio
                </button>

                <button id="transcribe-button" type="button" disabled>
                    Transcribe audio
                </button>
            </div>

            <section id="transcript-section" hidden>
            <h3>Recognized speech</h3>
            <p id="transcript-text"></p>
            <p id="transcript-details"></p>

            <button id="understand-button" type="button">
                Understand request
                </button>

                <p id="intent-result" role="status" aria-live="polite"></p>
            </section>

            <button id="execute-button" type="button">
                Execute request
            </button>
            <br><br>
            <button id="newChatButton" type="button">
                + New Chat
            </button>

            <div class="conversation-sidebar">
                <div class="conversation-header">
                    <h3>Chat History</h3>
                    
                </div>

                <div id="conversationList">
                    <p>Loading conversations...</p>
                </div>
            </div>

            <p id="action-result" role="status" aria-live="polite"></p>
            <section class="chat-history-display">
                <h3>Conversation</h3>
                <div id="chatMessages" aria-live="polite">
                    <p>Start speaking to VERA to begin.</p>
                </div>
            </section>
            
            <section id="preview-section" hidden>
                <h3>Recording preview</h3>
                <audio id="audio-preview" controls></audio>
                <p id="audio-info"></p>
            </section>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <footer>
            VERA · Local AI project
        </footer>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
